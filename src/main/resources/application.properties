spring.application.name=papeleria-spring

# Configuración de SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:14330;databaseName=papeleria_sena;encrypt=true;trustServerCertificate=true
spring.datasource.username=usuario_papeleria
spring.datasource.password=${PAPELERIA_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecto de SQL Server
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Puerto
server.port=8080